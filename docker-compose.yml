# Infraestructura local de EcoSoap ERP.
#
# En esta etapa el compose contiene unicamente PostgreSQL: el backend y el
# frontend se ejecutan localmente con pnpm. Dockerizarlos se pospone porque el
# hot-reload dentro de un contenedor en Windows es lento y fragil.
#
# Las credenciales provienen del archivo .env de la raiz.

services:
  postgres:
    image: postgres:18-alpine
    container_name: ecosoap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 cambio la convencion: el volumen se monta en
      # /var/lib/postgresql (no en .../data) para que la imagen cree un
      # subdirectorio por version mayor y permita pg_upgrade --link sin cruzar
      # el limite del punto de montaje. Con la ruta antigua el contenedor
      # arranca en bucle y termina en "unhealthy".
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Hace observable el estado de la base: "healthy" deja de ser una suposicion.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: ecosoap-postgres-data
